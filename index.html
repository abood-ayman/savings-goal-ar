<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاسبة هدف التوفير | أداة مجانية</title>
<meta name="description" content="كم شهرًا تحتاج لتصل لهدفك؟ وكم تدخر شهريًا لتصل إليه في موعد محدد؟ مع احتساب عائد سنوي اختياري. دون إرسال أي بيانات.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:1.6rem 1rem;text-align:center}
header h1{font-size:1.5rem}
.tagline{opacity:.92;font-size:.95rem;margin-top:.25rem}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:1rem}
.card{background:#fff;border-radius:14px;padding:1.25rem;box-shadow:0 1px 4px rgba(15,23,42,.08);margin-bottom:1rem}
.card h2{font-size:1.1rem;margin-bottom:.4rem;color:#0f766e}
label{display:block;font-weight:700;margin:.75rem 0 .3rem}
input,select,textarea{width:100%;padding:.7rem .8rem;border:1.5px solid #cbd5e1;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:#1e293b}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0f766e;box-shadow:0 0 0 3px rgba(20,184,166,.18)}
.row{display:flex;gap:.6rem}
.row>*{flex:1;min-width:0}
button{display:inline-block;width:100%;padding:.8rem;border:0;border-radius:10px;background:#0f766e;color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:1rem}
button:hover{background:#115e59}
button.ghost{background:#e2e8f0;color:#1e293b}
.result{background:#ecfdf5;border:1.5px solid #6ee7b7;border-radius:10px;padding:1rem;margin-top:1rem;font-size:1.05rem;word-break:break-word}
.result b{color:#047857}
.result.warn{background:#fffbeb;border-color:#fcd34d}
.result.warn b{color:#b45309}
.result.bad{background:#fef2f2;border-color:#fca5a5}
.result.bad b{color:#b91c1c}
.muted{color:#64748b;font-size:.85rem}
footer{background:#0f172a;color:#94a3b8;text-align:center;padding:1.2rem 1rem;font-size:.85rem;line-height:1.9}
footer a{color:#5eead4}
table{width:100%;border-collapse:collapse;margin-top:.5rem}
th,td{padding:.5rem;border-bottom:1px solid #e2e8f0;text-align:right;font-size:.95rem}
.big{font-size:1.6rem;font-weight:800}
.hidden{display:none}
.chk{display:flex;align-items:center;gap:.5rem;margin:.3rem 0}
.chk input{width:auto}

</style>
</head>
<body>
<header>
<h1>حاسبة هدف التوفير</h1>
<p class="tagline">خطط لهدفك: موبايل جديد، رحلة، جهاز لابتوب — واعرف كم تدخر شهريًا</p>
</header>
<main>
<div class="card">
<h2>هدفك</h2>
<label for="goal">مبلغ الهدف (جنيه)</label>
<input type="number" inputmode="decimal" id="goal" min="0" placeholder="20000">
<div class="row">
<div>
<label for="current">المدخر حاليًا</label>
<input type="number" inputmode="decimal" id="current" min="0" placeholder="0">
</div>
<div>
<label for="ret">عائد سنوي ٪ (اختياري)</label>
<input type="number" inputmode="decimal" id="ret" min="0" placeholder="0">
</div>
</div>
<label for="monthly">تدخر شهريًا (جنيه)</label>
<input type="number" inputmode="decimal" id="monthly" min="0" placeholder="1500">
<button onclick="calcMonths()">كم شهرًا أحتاج؟</button>
<div id="out1" class="result hidden"></div>
</div>
<div class="card">
<h2>أو حدد موعدًا</h2>
<label for="months">أريد الوصول خلال (شهور)</label>
<input type="number" inputmode="numeric" id="months" min="1" placeholder="12">
<button class="ghost" onclick="calcMonthly()">كم أدخر شهريًا؟</button>
<div id="out2" class="result hidden"></div>
</div>

</main>
<footer>
<p>تعمل هذه الأداة بالكامل على جهازك، ولا تُحفظ أو تُرسل أي بيانات إلى أي خادم.</p>
<p>أداة مجانية مفتوحة المصدر · بُنيت بمساعدة أدوات ذكاء اصطناعي · <a href="https://github.com/abood-ayman/savings-goal-ar">الكود على GitHub</a></p>
</footer>
<script>
window.__jserrors=[];window.addEventListener('error',function(e){window.__jserrors.push(String(e.message))});
const g = id => document.getElementById(id);
const num = id => { const v = parseFloat(g(id).value); return isNaN(v) ? 0 : v; };
const fmt = x => x.toLocaleString('ar-EG', { maximumFractionDigits: 0 }) + ' جنيه';

function monthsNeeded(goal, current, monthly, annualPct) {
  if (goal <= current) return 0;
  if (monthly <= 0 && annualPct <= 0) return Infinity;
  const r = annualPct / 100 / 12;
  let bal = current, m = 0;
  while (bal < goal && m < 1200) {
    bal = bal * (1 + r) + monthly;
    m++;
    if (monthly <= 0 && r <= 0) return Infinity;
  }
  return bal >= goal ? m : Infinity;
}

function monthlyNeeded(goal, current, months, annualPct) {
  const r = annualPct / 100 / 12;
  if (months <= 0) return NaN;
  if (r === 0) return Math.max(0, (goal - current) / months);
  const growth = current * (Math.pow(1 + r, months) - 1) + current;
  const needed = (goal - growth) * r / (Math.pow(1 + r, months) - 1);
  return Math.max(0, needed);
}

function calcMonths() {
  const goal = num('goal'), cur = num('current'), mo = num('monthly'), ret = num('ret');
  const m = monthsNeeded(goal, cur, mo, ret);
  const el = g('out1');
  el.classList.remove('hidden', 'warn');
  if (!isFinite(m)) { el.classList.add('warn'); el.innerHTML = '<p>بهذا المبلغ الشهري لن تصل للهدف أبدًا. زِد المبلغ أو العائد.</p>'; return; }
  if (m === 0) { el.innerHTML = '<p><b>مبروك، المبلغ متوفر بالفعل!</b></p>'; return; }
  const y = Math.floor(m / 12), mm = m % 12;
  el.innerHTML = '<p class="big">تحتاج: <b>' + (y ? y + ' سنة و ' : '') + mm + ' شهرًا</b></p>' +
                 '<p>ستصل لهدفك (' + fmt(goal) + ') تقريبًا بعد ' + m + ' شهرًا من الالتزام.</p>';
}

function calcMonthly() {
  const goal = num('goal'), cur = num('current'), months = num('months'), ret = num('ret');
  const need = monthlyNeeded(goal, cur, months, ret);
  const el = g('out2');
  el.classList.remove('hidden');
  if (isNaN(need)) { el.innerHTML = '<p>أدخل عدد الشهور.</p>'; return; }
  el.innerHTML = '<p class="big">ادخر شهريًا: <b>' + fmt(Math.ceil(need)) + '</b></p>' +
                 '<p>لتصل إلى ' + fmt(goal) + ' خلال ' + months + ' شهرًا.</p>';
}

window.__test = function () {
  const a = monthsNeeded(12000, 0, 1000, 0);
  const b = monthsNeeded(5000, 5000, 0, 0);
  const c = monthsNeeded(10000, 0, 0, 0);
  const d = monthlyNeeded(12000, 0, 12, 0);
  const e = monthlyNeeded(10000, 5000, 10, 0);
  const f = monthsNeeded(12000, 0, 1000, 12);
  const ok = a === 12 && b === 0 && c === Infinity &&
             Math.abs(d - 1000) < 0.001 && Math.abs(e - 500) < 0.001 &&
             f <= 12 && f >= 11;
  return { pass: ok, details: { a, b, c, d, e, f } };
};

window.__demo = function () {
  g('goal').value = 20000; g('current').value = 2000; g('monthly').value = 1500; g('ret').value = 0;
  calcMonths();
  g('months').value = 12; calcMonthly();
};

</script>
</body>
</html>
